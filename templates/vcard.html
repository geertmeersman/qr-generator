<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ naam }}</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 text-white flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-slate-800 rounded-2xl shadow-xl p-8 border border-slate-700 text-center">
    {% if foto_b64 %}
    <img src="data:image/jpeg;base64,{{ foto_b64 }}" class="w-24 h-24 rounded-full object-cover mx-auto mb-4 border-2 border-slate-600">
    {% endif %}
    <h1 class="text-2xl font-bold mb-6">{{ naam }}</h1>
    <a href="/vcard/{{ id }}/download"
      class="inline-block w-full bg-indigo-600 hover:bg-indigo-500 transition-colors rounded-xl py-3 font-semibold">
      ⬇ {{ _("Save contact") }}
    </a>
  </div>
</body>
</html>
