name: Release 🚀

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: 🗑 Delete drafts
        uses: hugo19941994/delete-draft-releases@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Draft release
        uses: release-drafter/release-drafter@v7
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          publish: false

      - name: Display version info
        run: echo 'Next version: ${{ steps.draft.outputs.tag_name }}'

      - name: Write VERSION file
        run: echo "${{ steps.draft.outputs.tag_name }}" > VERSION

      - name: Commit VERSION file
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: bump version to ${{ steps.draft.outputs.tag_name }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            geertmeersman/qr-generator:latest
            geertmeersman/qr-generator:${{ steps.draft.outputs.tag_name }}

      - name: 🚀 Publish release
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          publish: true
          tag: ${{ steps.draft.outputs.tag_name }}
          name: ${{ steps.draft.outputs.tag_name }}

      - name: Update Docker Hub description
        run: |
          PYVERSION=$(grep "^# python:3.13-slim" Dockerfile | awk '{print $3}')
          sed "s|PYTHON_VERSION_PLACEHOLDER|${PYVERSION}|" DOCKERHUB.md > DOCKERHUB.tmp.md

      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: geertmeersman/qr-generator
          readme-filepath: ./DOCKERHUB.tmp.md
