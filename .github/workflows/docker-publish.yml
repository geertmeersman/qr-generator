name: Docker Publish

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Get upstream digest and version
        id: upstream
        run: |
          DIGEST=$(curl -s "https://hub.docker.com/v2/repositories/library/python/tags/3.13-slim" | jq -r '.digest')
          VERSION=$(curl -s "https://hub.docker.com/v2/repositories/library/python/tags/?name=3.13." \
            | jq -r '.results[] | select(.name | test("^3\\.13\\.[0-9]+-slim$")) | .name' \
            | sort -V | tail -1)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Get last known digest
        id: stored
        run: |
          STORED=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/BASE_IMAGE_DIGEST" \
            | jq -r '.value // ""')
          echo "digest=${STORED}" >> $GITHUB_OUTPUT

      - name: Compare digests
        id: compare
        run: |
          if [[ "${{ steps.upstream.outputs.digest }}" != "${{ steps.stored.outputs.digest }}" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update stored digest
        if: steps.compare.outputs.changed == 'true'
        run: |
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/BASE_IMAGE_DIGEST" \
            -d "{\"name\":\"BASE_IMAGE_DIGEST\",\"value\":\"${{ steps.upstream.outputs.digest }}\"}" \
          || curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
            -d "{\"name\":\"BASE_IMAGE_DIGEST\",\"value\":\"${{ steps.upstream.outputs.digest }}\"}"

      - name: Login to Docker Hub
        if: steps.compare.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.compare.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.compare.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 for scanning
        if: steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/qr-generator:latest
          cache-to: type=gha,mode=max

      - name: Trivy security scan
        if: steps.compare.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/qr-generator:latest
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Get Python version from image
        if: steps.compare.outputs.changed == 'true'
        id: versions
        run: |
          PYTHON=$(docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/qr-generator:latest python --version | awk '{print $2}')
          echo "python=${PYTHON}" >> $GITHUB_OUTPUT

      - name: Build and push multi-platform
        if: steps.compare.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/qr-generator:latest
          cache-from: type=gha

      - name: Create PR with updated Dockerfile
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="fix/pin-python-3.13-slim-${{ steps.upstream.outputs.version }}"
          git checkout -b "${BRANCH}"
          sed -i "s|^# python:3.13-slim .*|# python:3.13-slim ${{ steps.upstream.outputs.version }}|" Dockerfile
          sed -i "s|^FROM python:3.13-slim@.*|FROM python:3.13-slim@${{ steps.upstream.outputs.digest }}|" Dockerfile
          git add Dockerfile
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "fix: pin python:3.13-slim to ${{ steps.upstream.outputs.version }} (${{ steps.upstream.outputs.digest }})"
          git push origin "${BRANCH}"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{
              \"title\": \"fix: pin python:3.13-slim to ${{ steps.upstream.outputs.version }}\",
              \"body\": \"Automated base image update.\n\n- New digest: \`${{ steps.upstream.outputs.digest }}\`\n- Python version: \`${{ steps.versions.outputs.python }}\`\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\"
            }"

      - name: Update Docker Hub description
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/qr-generator
          readme-filepath: ./DOCKERHUB.md
