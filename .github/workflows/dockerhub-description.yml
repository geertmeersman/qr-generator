name: Docker Hub description 🐳

on:
  push:
    branches: [main]
    paths:
      - DOCKER_HUB.md
  workflow_dispatch:

concurrency:
  group: dockerhub-description
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-description:
    name: Sync Docker Hub description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill version placeholder
        run: |
          VERSION=$(grep "^# python:3.13-slim" Dockerfile | awk '{print $3}')
          sed "s|PYTHON_VERSION_PLACEHOLDER|${VERSION}|" DOCKER_HUB.md > DOCKER_HUB.tmp.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: geertmeersman/qr-generator
          readme-filepath: ./DOCKER_HUB.tmp.md
          enable-url-completion: true
